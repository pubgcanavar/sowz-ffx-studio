name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/gradle_build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::group::Gradle output (son 300 satir)"
            tail -n 300 /tmp/gradle_build.log
            echo "::endgroup::"
            grep -E "^(e:|error:|> |FAILURE|Caused by|Could not)" /tmp/gradle_build.log | tail -n 25 | while IFS= read -r line; do
              safe=$(echo "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error::$safe"
            done
          fi
          exit $code

      - name: Dosya adlari
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Sowz-FFX-Studio.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Sowz-FFX-Studio-apk
          path: dist/Sowz-FFX-Studio.apk

      - name: GitHub Release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Sowz-FFX-Studio.apk --title "Sowz FFX Studio (latest)" \
            --notes "Otomatik build (debug imzasi). APK'yi telefona yukle: Sowz-FFX-Studio.apk"
